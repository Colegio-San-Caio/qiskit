name: Qiskit Bell Test + termuxDB

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  bell:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Qiskit + deps
      run: |
        python -m pip install --upgrade pip
        pip install qiskit qiskit-aer flake8

    - name: Lint Bell file
      run: |
        flake8 quantum_test.py --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Setup termuxDB (fresh on CI)
      run: |
        chmod +x termuxDB.sh
        ./termuxDB.sh init
        ./termuxDB.sh info
        ls -lh termuxDB.bin
        cat termuxDB.bin

    - name: Run Bell state demo
      run: |
        python quantum_test.py

    - name: Verify entanglement (only 00 and 11)
      run: |
        python -c "
        from qiskit import QuantumCircuit
        from qiskit_aer import AerSimulator
        circ = QuantumCircuit(2,2)
        circ.h(0)
        circ.cx(0,1)
        circ.measure([0,1],[0,1])
        counts = AerSimulator().run(circ, shots=1024).result().get_counts()
        print('Counts:', counts)
        assert '01' not in counts and '10' not in counts, f'Bell failed {counts}'
        assert counts.get('00',0) + counts.get('11',0) == 1024
        print('Bell verified OK')
        "

    - name: Upload termuxDB artifact
      uses: actions/upload-artifact@v4
      with:
        name: termuxDB
        path: termuxDB.bin
        if-no-files-found: warn
