name: Qiskit Bell Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  bell:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Qiskit
      run: |
        python -m pip install --upgrade pip
        pip install qiskit qiskit-aer

    - name: Lint Bell file only
      run: |
        pip install flake8
        flake8 quantum_test.py --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run Bell state demo
      run: |
        python quantum_test.py

    - name: Verify entanglement
      run: |
        python -c "
        from qiskit import QuantumCircuit
        from qiskit_aer import AerSimulator
        circ = QuantumCircuit(2,2)
        circ.h(0)
        circ.cx(0,1)
        circ.measure([0,1],[0,1])
        counts = AerSimulator().run(circ, shots=1024).result().get_counts()
        assert '01' not in counts and '10' not in counts, f'Bell failed, got {counts}'
        assert counts.get('00',0) + counts.get('11',0) == 1024
        print('Bell verified:', counts)
        "
